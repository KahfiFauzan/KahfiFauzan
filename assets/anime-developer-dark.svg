<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Animated anime developer blinking and typing at laptop">
<style>
.float{animation:float 3.4s ease-in-out infinite;transform-origin:660px 210px}.hair{animation:hair 3.4s ease-in-out infinite;transform-origin:650px 96px}.eye{animation:blink 5.2s infinite;transform-origin:center}.hand{animation:type .26s ease-in-out infinite alternate;transform-origin:670px 239px}.code{animation:code 1.3s steps(4) infinite}.spark{animation:spark 2s ease-in-out infinite alternate}.bar{animation:bar 2.8s ease-in-out infinite alternate;transform-origin:0 100%}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes hair{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(2deg)}}@keyframes blink{0%,45%,50%,100%{transform:scaleY(1)}47%{transform:scaleY(.08)}}@keyframes type{to{transform:translateY(5px) rotate(3deg)}}@keyframes code{0%{opacity:.3}50%{opacity:1}100%{opacity:.5}}@keyframes spark{to{opacity:.2;transform:translateY(-8px)}}@keyframes bar{to{transform:scaleY(.65)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
